<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="289" viewBox="0 0 1000 289" role="img" aria-label="About Ganesh Acharya"><title>About Ganesh Acharya</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}</style><defs><clipPath id="c"><rect width="1000" height="289" rx="18"/></clipPath></defs><g clip-path="url(#c)"><rect width="1000" height="289" rx="18" fill="#FFFFFF"/><rect x=".75" y=".75" width="998.5" height="287.5" rx="18" fill="none" stroke="#DDE4EE" stroke-width="1.5"/><text x="44" y="74" font-size="30" font-weight="700" fill="#13203A" letter-spacing="-.6">Every role, the same job: <tspan font-style="italic" fill="#1E5B8F">connect the two sides.</tspan></text><text x="44" y="122" font-size="17.5" fill="#55627A">I design how organisations relate to the people they serve, using digital tools and, more</text><text x="44" y="149" font-size="17.5" fill="#55627A">and more, AI. My career runs across community radio, national TV, government, the UN,</text><text x="44" y="176" font-size="17.5" fill="#55627A">development programmes and public media, in Nepal and Australia. Today I am a PhD researcher</text><text x="44" y="203" font-size="17.5" fill="#55627A">at the University of Melbourne, studying how technology is changing communication.</text><rect x="44" y="235" width="82" height="30" rx="15.0" fill="#EEF3F9"/><text x="85" y="254.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E5B8F">Strategy</text><rect x="136" y="235" width="157" height="30" rx="15.0" fill="#EEF3F9"/><text x="214" y="254.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E5B8F">Digital, data &amp; AI</text><rect x="303" y="235" width="172" height="30" rx="15.0" fill="#EEF3F9"/><text x="389" y="254.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E5B8F">Knowledge &amp; delivery</text></g></svg>